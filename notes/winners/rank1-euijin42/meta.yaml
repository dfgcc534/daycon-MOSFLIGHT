notes: |
  - 자체 완결 노트북 1개로 raw → preprocess → train → submit 전 과정.
  - cv_1step base 위 yaw회전 잔차 학습 (모든 3 arch 공통).
  - 30 model = 3 arch × 10 seed. 등가중 평균.
  - Soft R-Hit loss (1cm sigmoid 근사) 가 0.7 진입 공통 기법.
  - Full-fit (no fold split). OOF 비교는 우리 split 위에 별도 wrapper 필요.
  - Y-flip TTA 모든 모델.
  - HyperPhysics 의 θ-가중 oversampling (급선회 최대 5x) — 우리 plan 들에 없는 lever.
  - Neural ODE 의 RK4 nsteps=4 + damping vector = plan-d-001 NODE001 (OOF 0.6330) 와 같은 paradigm 이지만 학습 procedure 가 더 정교 (cv_1step residual + EMA + cache pretrain).
